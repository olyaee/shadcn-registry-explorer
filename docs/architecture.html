<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f5; --card: #ffffff; --box: #ffffff; --line: #d4d4d8; --soft: #e4e4e7;
    --ink: #18181b; --mute: #71717a; --faint: #a1a1aa; --accent: #2563eb; --accent-soft: #dbeafe;
  }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); padding: 24px; width: 1366px; box-sizing: border-box; }
  .card { background: var(--card); border: 1px solid var(--soft); border-radius: 16px; padding: 8px 8px 22px;
          box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(24,24,27,.05); }
  svg { display: block; }
  .lbl { font: 500 11px Inter, sans-serif; letter-spacing: .14em; fill: var(--faint); }
  .lbl.accent { fill: var(--accent); }
  .t  { font: 600 15px Inter, sans-serif; fill: var(--ink); }
  .m  { font: 400 12.5px "JetBrains Mono", ui-monospace, monospace; fill: #52525b; }
  .s  { font: 500 13px Inter, sans-serif; fill: var(--ink); }
  .d  { font: 400 11.5px Inter, sans-serif; fill: var(--mute); }
  .e  { font: 400 12px Inter, sans-serif; fill: var(--mute); }
  .e.accent { fill: var(--accent); }
  .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
  .region { fill: none; stroke: #c4c4cc; stroke-width: 1.4; stroke-dasharray: 1.5 5; stroke-linecap: round; }
  .arrow { stroke: #71717a; stroke-width: 1.3; fill: none; }
  .arrow.accent { stroke: var(--accent); stroke-width: 1.6; }
  .dash { stroke-dasharray: 5 4; }
  .caption { font-size: 15.5px; line-height: 1.6; color: #52525b; margin: 6px 28px 0; }
  .caption code { font-family: "JetBrains Mono", monospace; font-size: 14px; color: var(--ink); background: #f4f4f5;
                  padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="card">
<svg width="1300" height="540" viewBox="0 0 1300 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#18181b" flood-opacity=".06"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#71717a"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/></marker>
  </defs>

  <!-- column labels -->
  <text class="lbl" x="135" y="80" text-anchor="middle">SOURCE</text>
  <text class="lbl" x="1194" y="80" text-anchor="middle">YOU</text>

  <!-- repo region -->
  <rect class="region" x="250" y="46" width="800" height="478" rx="14"/>
  <text class="lbl" x="274" y="80">SHADCN REGISTRY EXPLORER</text>

  <!-- divider -->
  <line x1="750" y1="30" x2="750" y2="530" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text class="lbl accent" x="766" y="80">YOUR MACHINE</text>

  <!-- source -->
  <rect class="box" filter="url(#sh)" x="40" y="108" width="190" height="72" rx="10"/>
  <text class="t" x="135" y="138" text-anchor="middle">shadcn directory</text>
  <text class="d" x="135" y="159" text-anchor="middle">394 community registries</text>
  <path class="arrow" marker-end="url(#a)" d="M230,144 L273,144"/>
  <text class="e" x="251" y="134" text-anchor="middle">MCP</text>

  <!-- pipeline -->
  <rect class="box" filter="url(#sh)" x="276" y="100" width="274" height="282" rx="10"/>
  <text class="t" x="296" y="130">Refresh pipeline</text>
  <text class="m" x="296" y="150">Python · run per refresh</text>
  <line x1="296" y1="166" x2="530" y2="166" stroke="#e4e4e7"/>
  <text class="s" x="296" y="192">Harvest</text>
  <text class="d" x="296" y="210">shadcn MCP · 76k items</text>
  <text class="s" x="296" y="240">Enrich</text>
  <text class="d" x="296" y="258">LLM descriptions, tags, kinds</text>
  <text class="s" x="296" y="288">Embed</text>
  <text class="d" x="296" y="306">text-embedding-3-large</text>
  <text class="s" x="296" y="336">Cluster</text>
  <text class="d" x="296" y="354">18 domains → 711 categories</text>

  <!-- publish -->
  <path class="arrow" marker-end="url(#a)" d="M413,382 L413,418"/>
  <text class="e" x="423" y="404">publish</text>

  <!-- github -->
  <rect class="box" filter="url(#sh)" x="276" y="420" width="420" height="84" rx="10"/>
  <text class="t" x="296" y="449">GitHub · public</text>
  <text class="m" x="296" y="476">repo</text>
  <text class="d" x="296" y="493">package, AGENTS.md, ./find</text>
  <text class="m" x="490" y="476">release</text>
  <text class="d" x="490" y="493">catalogue, graph, vectors</text>

  <!-- first run (crosses the line) -->
  <path class="arrow accent" marker-end="url(#b)" d="M696,462 L782,462"/>
  <text class="e accent" x="721" y="452" text-anchor="middle">first run</text>

  <!-- local data -->
  <rect class="box" filter="url(#sh)" x="784" y="420" width="246" height="84" rx="10"/>
  <text class="t" x="804" y="449">Local data</text>
  <text class="m" x="804" y="476">~/.cache or the clone</text>
  <text class="d" x="804" y="493">downloaded once, then offline</text>

  <path class="arrow" marker-end="url(#a)" d="M907,420 L907,292"/>
  <text class="e" x="917" y="360">reads</text>

  <!-- find -->
  <rect class="box" filter="url(#sh)" x="784" y="100" width="246" height="190" rx="10"/>
  <text class="t" x="804" y="130">Search</text>
  <text class="m" x="804" y="150">MCP server · ./find</text>
  <line x1="804" y1="166" x2="1010" y2="166" stroke="#e4e4e7"/>
  <text class="s" x="804" y="192">Hybrid search</text>
  <text class="d" x="804" y="210">meaning + keywords, fused</text>
  <text class="s" x="804" y="240">Graph</text>
  <text class="d" x="804" y="258">every library's version of X</text>

  <!-- agent -->
  <rect class="box" filter="url(#sh)" x="1110" y="108" width="168" height="72" rx="10"/>
  <text class="t" x="1194" y="138" text-anchor="middle">Your agent</text>
  <text class="d" x="1194" y="159" text-anchor="middle">Claude Code · Cursor · Codex</text>
  <path class="arrow" marker-end="url(#a)" d="M1110,130 L1032,130"/>
  <text class="e" x="1080" y="121" text-anchor="middle">brief</text>
  <path class="arrow" marker-end="url(#a)" d="M1030,160 L1108,160"/>
  <text class="e" x="1080" y="178" text-anchor="middle">shortlist</text>

  <!-- openai key (optional) -->
  <rect x="1110" y="222" width="168" height="72" rx="10" fill="none" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="t" x="1194" y="252" text-anchor="middle">OpenAI key</text>
  <text class="d" x="1194" y="273" text-anchor="middle">optional · embeds the query</text>
  <path class="arrow dash" marker-end="url(#a)" d="M1110,258 L1032,258"/>
</svg>
<p class="caption">Everything left of the blue line runs once per refresh and is published to GitHub; everything right of it
runs on your machine. The MCP server (or <code>./find</code>) downloads the data on first run, then searches locally — only your query
text leaves the machine, and only if you add an OpenAI key.</p>
</div>
</body>
</html>
