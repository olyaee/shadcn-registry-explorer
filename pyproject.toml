[project]
name = "shadcn-explorer"
version = "0.1.0"
description = "Find shadcn/ui community components for what you're building — hybrid search over 394 registries, as a CLI and MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "openai>=1.0", "python-dotenv>=1.0", "mcp>=2.2,<3"]

[project.scripts]
shadcn-explorer = "shadcn_explorer.cli:main"
shadcn-explorer-mcp = "shadcn_explorer.mcp_server:main"

[project.urls]
Homepage = "https://github.com/olyaee/shadcn-registry-explorer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shadcn_explorer"]

[tool.hatch.build.targets.wheel.force-include]
"data/artifacts.json" = "shadcn_explorer/artifacts.json"
